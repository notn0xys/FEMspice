services:
  backend:
    image: femspice-backend
    expose:
      - "8000"
    restart: unless-stopped
    deploy:
      replicas: 2
  nginx:
    image: nginx:latest
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel run femspice
    volumes:
      - ~/.cloudflared:/etc/cloudflared
    depends_on:
      - nginx
    restart: unless-stopped
